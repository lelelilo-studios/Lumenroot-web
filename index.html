<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { color: #e8dcc0; background: #101d20; overflow: hidden; touch-action: none; }
#canvas { display: block; }
#canvas:focus { outline: none; }
#status {
  position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center;
  background: radial-gradient(ellipse at 50% 55%, #22393a 0%, #16262a 45%, #0c1618 100%);
  font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif; visibility: hidden;
  transition: opacity 0.9s ease;
}
#status.done { opacity: 0; pointer-events: none; }
/* paper grain */
#status::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0.09; mix-blend-mode: soft-light;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
#bells { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: min(1000px, 96vw); height: 90px; }
#bells .bell { animation: sway 3.2s ease-in-out infinite alternate; }
@keyframes sway { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }
#emblem { width: min(300px, 42vh); height: min(300px, 42vh); overflow: visible; }
#ring { transform-origin: 128px 128px; animation: turn 60s linear infinite; }
@keyframes turn { to { transform: rotate(360deg); } }
.moth { transform-origin: 128px 124px; animation: orbit 3.1s linear infinite; }
.moth.b { animation-duration: 4.3s; animation-direction: reverse; }
@keyframes orbit { to { transform: rotate(360deg); } }
#flame { transform-origin: 128px 140px; animation: flicker 0.23s ease-in-out infinite alternate; }
@keyframes flicker { from { transform: scale(1, 1); } to { transform: scale(0.94, 1.06); } }
h1 { font-weight: normal; letter-spacing: 0.55em; margin: 18px 0 4px 0.55em; font-size: clamp(26px, 4.6vh, 46px); color: #e8dcc0; }
#proverb { margin: 6px; font-style: italic; color: #b89a78; font-size: clamp(14px, 2.2vh, 20px); min-height: 1.4em; transition: opacity 0.6s; }
#state { margin-top: 22px; font-size: clamp(12px, 1.7vh, 15px); letter-spacing: 0.12em; color: #8fa8a0; }
#made-with { position: absolute; right: 16px; bottom: 12px; display: flex; align-items: center; gap: 7px; opacity: 0.5;
  font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif; font-size: 12px; color: #e8dcc0; }
#made-with img { width: 18px; height: 18px; }
#status-notice { display: none; background: #5b3943; border-radius: 0.5rem; border: 1px solid #9b3943; color: #e0e0e0;
  font-family: 'Noto Sans', Arial, sans-serif; line-height: 1.3; margin: 1rem 2rem; padding: 1rem; text-align: center; z-index: 1; }
</style>

<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":711588,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusNotice = document.getElementById('status-notice');
	const pct = document.getElementById('pct');
	const fillRect = document.getElementById('fillrect');
	const glow = document.getElementById('glow');
	const ring = document.getElementById('ring');
	const proverb = document.getElementById('proverb');

	// Lore lines while the parcel is unsealed.
	const lines = ['Every letter reaches its door.', 'Ring it once, and let it go.', 'What is kept, keeps you.',
		'Three hundred years overdue, and still warm.', 'Hush now, little bell, the root is warm and deep.'];
	let li = 0;
	const cycle = setInterval(() => {
		proverb.style.opacity = 0;
		setTimeout(() => { li = (li + 1) % lines.length; proverb.textContent = lines[li]; proverb.style.opacity = 1; }, 600);
	}, 3600);

	// The lantern fills with light as the game arrives.
	function setProgress(k) {
		k = Math.max(0, Math.min(1, k));
		const h = 66 * k;
		fillRect.setAttribute('y', 158 - h);
		fillRect.setAttribute('height', h);
		glow.setAttribute('opacity', 0.15 + 0.85 * k);
		ring.setAttribute('opacity', 0.25 + 0.65 * k);
		pct.textContent = Math.round(k * 100);
	}

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			clearInterval(cycle);
			setProgress(1);
			statusOverlay.classList.add('done');
			setTimeout(() => statusOverlay.remove(), 950);
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		text.split('\n').forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					setProgress(current / total);
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
</script>
