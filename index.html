<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }
html, body { width: 100%; height: 100%; overscroll-behavior: none; }
body { color: #e8dcc0; background: #101d20; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
#canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; }
#canvas:focus { outline: none; }
#status {
  position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center;
  background: radial-gradient(ellipse at 50% 55%, #22393a 0%, #16262a 45%, #0c1618 100%);
  font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif; visibility: hidden;
  transition: opacity 0.9s ease;
}
#status.done { opacity: 0; pointer-events: none; }
/* paper grain: a still layer (no blend mode, so nothing repaints each frame) */
#status::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0.05;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
/* Every moving thing is its own element and animates only transform/opacity,
   so it keeps moving on the compositor while the engine compiles. */
#beam { position: absolute; top: 6px; left: 50%; transform: translateX(-50%); width: min(1000px, 96vw); height: 6px;
  border-radius: 3px; background: linear-gradient(#7a5638, #5a3d27); box-shadow: 0 2px 3px rgba(0,0,0,0.35); }
#bells { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: min(1000px, 96vw); height: 90px;
  display: flex; justify-content: space-around; pointer-events: none; }
.bell { width: 34px; transform-origin: 50% 0; will-change: transform; animation: sway 3.2s ease-in-out infinite alternate; }
@keyframes sway { from { transform: rotate(-6deg); } to { transform: rotate(6deg); } }
#lamp { position: relative; width: min(300px, 42vh, 60vw); height: min(300px, 42vh, 60vw); }
#lamp > * { position: absolute; inset: 0; width: 100%; height: 100%; }
#emblem { overflow: visible; }
#ringlayer { will-change: transform; animation: turn 60s linear infinite; }
@keyframes turn { to { transform: rotate(360deg); } }
.orbit { will-change: transform; animation: orbit 3.1s linear infinite; }
.orbit.b { animation-duration: 4.3s; animation-direction: reverse; }
@keyframes orbit { to { transform: rotate(360deg); } }
.orbit i { position: absolute; left: 50%; top: 15%; width: 12px; height: 8px; margin-left: -6px; opacity: 0.8;
  background: radial-gradient(ellipse at 30% 50%, #e8dcc0 40%, transparent 42%), radial-gradient(ellipse at 70% 50%, #e8dcc0 40%, transparent 42%); }
.orbit.b i { top: 80%; transform: scale(0.8); }
#flicker { will-change: opacity; animation: flick 0.23s ease-in-out infinite alternate;
  background: radial-gradient(circle at 50% 51%, rgba(255, 236, 170, 0.55) 0, rgba(255, 200, 110, 0.18) 9%, transparent 16%); }
@keyframes flick { from { opacity: 0.55; } to { opacity: 1; } }
#state.warming #pct, #state.warming .pc { display: none; }
#shimmer { display: none; width: 140px; height: 2px; margin: 10px auto 0; overflow: hidden; border-radius: 1px; background: rgba(232, 200, 114, 0.18); }
#state.warming + #shimmer { display: block; }
#shimmer::after { content: ""; display: block; width: 40%; height: 100%; background: #e8c872; will-change: transform;
  animation: slide 1.1s ease-in-out infinite alternate; }
@keyframes slide { from { transform: translateX(-10%); } to { transform: translateX(160%); } }
/* Portrait phones: turn it sideways. */
#rotate { display: none; position: fixed; inset: 0; z-index: 20; background: rgba(12, 22, 24, 0.94); color: #e8dcc0;
  font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif; text-align: center;
  flex-direction: column; justify-content: center; align-items: center; padding: 24px; box-sizing: border-box; }
#rotate svg { width: 110px; height: 110px; will-change: transform; animation: tilt 2.4s ease-in-out infinite; }
@keyframes tilt { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
#rotate p { font-size: 19px; line-height: 1.5; max-width: 300px; }
#rotate small { color: #b89a78; font-style: italic; font-size: 15px; }
@media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
h1 { font-weight: normal; letter-spacing: 0.55em; margin: 18px 0 4px 0.55em; font-size: clamp(26px, 4.6vh, 46px); color: #e8dcc0; }
#proverb { margin: 6px; font-style: italic; color: #b89a78; font-size: clamp(14px, 2.2vh, 20px); min-height: 1.4em; transition: opacity 0.6s; }
#state { margin-top: 22px; font-size: clamp(12px, 1.7vh, 15px); letter-spacing: 0.12em; color: #8fa8a0; }
#made-with { position: absolute; right: 16px; bottom: 12px; display: flex; align-items: center; gap: 7px; opacity: 0.5;
  font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif; font-size: 12px; color: #e8dcc0; }
#made-with img { width: 18px; height: 18px; }
#status-notice { display: none; background: #5b3943; border-radius: 0.5rem; border: 1px solid #9b3943; color: #e0e0e0;
  font-family: 'Noto Sans', Arial, sans-serif; line-height: 1.3; margin: 1rem 2rem; padding: 1rem; text-align: center; z-index: 1; }

<script>
// A phone draws three device pixels to every CSS pixel. For a painted,
// soft-focus game that's several times the GPU work (and heat) for little
// to see, so touch screens render at most 2 per CSS pixel; the browser scales
// up the rest. Godot reads window.devicePixelRatio to size its canvas.
// ?dpr=1.5 (etc.) overrides, for measuring.
(function () {
	const real = window.devicePixelRatio || 1;
	const asked = Number(new URLSearchParams(location.search).get('dpr'));
	const coarse = window.matchMedia('(pointer: coarse)').matches;
	const cap = asked > 0 ? asked : (coarse ? 2 : real);
	if (cap < real) {
		Object.defineProperty(window, 'devicePixelRatio', { get: () => cap, configurable: true });
	}
})();
</script>
<script>
// The notch and the home bar, in CSS pixels [left, top, right, bottom]: the
// touch controls keep clear of them (read by ui/touch_controls.gd).
window.lumenSafeArea = function () {
	const d = document.createElement('div');
	d.style.cssText = 'position:fixed;top:0;left:0;visibility:hidden;pointer-events:none;' +
		'padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';
	document.body.appendChild(d);
	const cs = getComputedStyle(d);
	const r = [cs.paddingLeft, cs.paddingTop, cs.paddingRight, cs.paddingBottom].map(v => parseFloat(v) || 0);
	d.remove();
	return JSON.stringify(r);
};
</script>
<script src="index.js"></script>
<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":3855332,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusNotice = document.getElementById('status-notice');
	const pct = document.getElementById('pct');
	const fillRect = document.getElementById('fillrect');
	const glow = document.getElementById('glow');
	const ring = document.getElementById('ring');
	const proverb = document.getElementById('proverb');
	const stateBox = document.getElementById('state');
	const stateText = document.getElementById('statetext');

	// Nine bells on the beam, each a little different, each swinging on its own.
	const bells = document.getElementById('bells');
	for (let k = 0; k < 9; k++) {
		const len = 18 + ((k * 7) % 5) * 7;
		const d = document.createElement('div');
		d.className = 'bell';
		d.style.animationDelay = (-k * 0.43) + 's';
		d.style.animationDuration = (2.8 + (k % 3) * 0.35) + 's';
		d.innerHTML = '<svg viewBox="0 0 34 90" width="34" height="90"><line x1="17" y1="0" x2="17" y2="' + len + '" stroke="#7a5a40" stroke-width="1.5"/>' +
			'<path d="M11 ' + len + ' L23 ' + len + ' L28 ' + (len + 17) + ' L6 ' + (len + 17) + ' Z" fill="#c9a45c"/>' +
			'<circle cx="17" cy="' + (len + 19) + '" r="2.4" fill="#2b3033"/>' +
			'<rect x="21" y="' + (len + 20) + '" width="12" height="6" rx="1" fill="#e8dcc0" opacity="0.8" transform="rotate(8 21 ' + (len + 20) + ')"/></svg>';
		bells.appendChild(d);
	}

	// On a phone: the first touch asks for fullscreen and holds landscape.
	window.addEventListener('touchend', function once() {
		window.removeEventListener('touchend', once);
		const el = document.documentElement;
		const fs = el.requestFullscreen || el.webkitRequestFullscreen;
		if (fs) {
			Promise.resolve(fs.call(el)).then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape')).catch(() => {});
		}
	}, { passive: true });

	// Lore lines while the parcel is unsealed.
	const lines = ['Every letter reaches its door.', 'Ring it once, and let it go.', 'What is kept, keeps you.',
		'Three hundred and eleven years overdue, and still warm.', 'Hush now, little bell, the root is warm and deep.'];
	let li = 0;
	const cycle = setInterval(() => {
		proverb.style.opacity = 0;
		setTimeout(() => { li = (li + 1) % lines.length; proverb.textContent = lines[li]; proverb.style.opacity = 1; }, 600);
	}, 3600);

	// The lantern fills with light as the game arrives.
	function setProgress(k) {
		k = Math.max(0, Math.min(1, k));
		// Downloaded: the engine still has to compile and wake. Say so, don't sit at 100%.
		if (k >= 1 && !stateBox.classList.contains('warming')) {
			stateBox.classList.add('warming');
			stateText.textContent = 'Warming the lantern\u2026';
		}
		const h = 66 * k;
		fillRect.setAttribute('y', 158 - h);
		fillRect.setAttribute('height', h);
		glow.setAttribute('opacity', 0.15 + 0.85 * k);
		ring.setAttribute('opacity', 0.25 + 0.65 * k);
		pct.textContent = Math.round(k * 100);
	}

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			clearInterval(cycle);
			setProgress(1);
			statusOverlay.classList.add('done');
			setTimeout(() => statusOverlay.remove(), 950);
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		text.split('\n').forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					setProgress(current / total);
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
</script>
